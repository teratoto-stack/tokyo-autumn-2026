<body>
<title>Grace와 도쿄, 가을</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. Map/list/near/info views swap under a sticky header; bottom tab bar fixed. Place detail opens as a bottom sheet. */
:root{
  --bg:#f4efe8; --bg2:#ebe4da; --card:#fbf8f3; --fg:#2a2420; --mute:#7a6f66; --line:#dcd2c6;
  --accent:#c4643a; --accent-fg:#ffffff; --green:#52704c; --water:#c7d6de; --rail:#b9ada0; --park:#d6dec8; --shadow:0 10px 30px rgba(60,40,20,.14);
  --disp:"Gowun Batang","Shippori Mincho","Noto Serif KR",serif; --body:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif; --ja:"Shippori Mincho","Noto Sans JP",serif;
  --c-stay:#e11d48; --c-see:#0284c7; --c-eat:#ea580c; --c-cafe:#b45309; --c-shop:#7c3aed; --c-run:#15803d; --c-tr:#475569; --c-univ:#4338ca; --route:#1f2937;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e1a17; --bg2:#272220; --card:#2b2623; --fg:#ece4da; --mute:#a69a8e; --line:#3d3631;
  --accent:#d9825a; --accent-fg:#1e1a17; --green:#8fae86; --water:#2f3d46; --rail:#5a524b; --park:#2f3a2c; --shadow:0 10px 30px rgba(0,0,0,.45);
  --c-stay:#fb7185; --c-see:#38bdf8; --c-eat:#fb923c; --c-cafe:#fbbf24; --c-shop:#a78bfa; --c-run:#4ade80; --c-tr:#94a3b8; --c-univ:#a5b4fc; --route:#e5e7eb; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1e1a17; --bg2:#272220; --card:#2b2623; --fg:#ece4da; --mute:#a69a8e; --line:#3d3631;
  --accent:#d9825a; --accent-fg:#1e1a17; --green:#8fae86; --water:#2f3d46; --rail:#5a524b; --park:#2f3a2c; --shadow:0 10px 30px rgba(0,0,0,.45);
  --c-stay:#fb7185; --c-see:#38bdf8; --c-eat:#fb923c; --c-cafe:#fbbf24; --c-shop:#a78bfa; --c-run:#4ade80; --c-tr:#94a3b8; --c-univ:#a5b4fc; --route:#e5e7eb; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
.ja{font-family:var(--ja);font-weight:500}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
header.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
header.top .t{font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:.01em}
header.top .t small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
header.top .clock{font-size:12px;color:var(--mute);text-align:right;line-height:1.3}
header.top .clock b{display:block;font-size:15px;color:var(--fg);font-weight:500}

main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.scroll{height:100%;overflow-y:auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}

nav.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--mute);border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--fg);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* map */
#mapwrap{position:absolute;inset:0;overflow:hidden;background:var(--bg2);touch-action:none;user-select:none}
#mapsvg{position:absolute;left:0;top:0;width:100%;height:100%}
#markers{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:1px}
.mk .pin{width:17px;height:17px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);background:var(--c)}
.mk.dim{opacity:.3}
.mk.me.dim{opacity:1}
.mk.stay .pin{width:24px;height:24px;border-width:3px}
.mk .lb{font-size:11px;font-weight:500;line-height:1.15;background:var(--card);color:var(--fg);padding:2px 6px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;display:none}
.mk.lbl .lb{display:block}
.mk.done .pin{opacity:.45}
.mk.sel .pin{transform:rotate(-45deg) scale(1.35)}
.mk.me{transform:translate(-50%,-50%)}
.mk.me .pin{width:16px;height:16px;border-radius:50%;transform:none;background:#2f7cf6;box-shadow:0 0 0 6px rgba(47,124,246,.25)}
.mapui{position:absolute;left:12px;right:12px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:800}
.mapui>*{pointer-events:auto}
.mapbtns{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:800}
.rbtn{width:42px;height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--fg)}
.rbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.legend{position:absolute;left:12px;bottom:14px;z-index:800;background:var(--card);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--mute);box-shadow:var(--shadow);display:flex;gap:8px;flex-wrap:wrap;max-width:62%}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.svgtxt{font-family:var(--ja);fill:var(--mute);font-size:var(--fs,1px)}
.svgtxt.big{font-size:calc(var(--fs,1px)*1.5)}
.svgtxt.sm{font-size:calc(var(--fs,1px)*.85)}
.svgtxt.big{letter-spacing:.1em}
header.top .t{text-align:left}
header.top .jv{font-size:11px;letter-spacing:.06em;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:4px 10px;text-decoration:none}
#lmap{position:absolute;inset:0}
#gmap{position:absolute;inset:0}
#gmap .mk{z-index:1}
#gmap .mk.stay{z-index:2}
#gmap .mk.sel{z-index:3}
.leaflet-container{background:var(--bg2);font-family:var(--body)}
.leaflet-div-icon{background:none;border:0}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.6)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile{filter:brightness(.8) contrast(1.05) saturate(.85)} }
:root[data-theme="dark"] .leaflet-tile{filter:brightness(.8) contrast(1.05) saturate(.85)}

/* list */
.day-strip{display:flex;gap:6px;margin-bottom:10px}
.day-strip button{flex:1;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:var(--card);text-align:center;line-height:1.2}
.day-strip button small{display:block;font-size:10px;color:var(--mute)}
.day-strip button b{font-size:14px;font-weight:500}
.day-strip button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day-strip button.on small{color:var(--bg);opacity:.75}
.sec{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border-radius:14px;text-align:left;width:100%;min-width:0}
.row .bar{width:4px;height:100%;min-height:36px;border-radius:4px;background:var(--c)}
.row .nm{font-weight:500;min-width:0}
.row .nm .ja{display:block;font-size:12px;color:var(--mute);font-weight:400}

function tokyoNow(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",hour12:false,weekday:"short",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric"}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);const wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday];return{wd,h:(+o.hour)%24,m:+o.minute,mo:+o.month,d:+o.day};}
const tm=s=>{const[a,b]=s.split(":").map(Number);return a*60+b;};
function openState(p,now){ // 0 열림, 1 닫힘, 2 정보없음, 3 곧 마감(60분 내)
  if(!p.h)return{s:2};const mins=now.h*60+now.m;const wd=now.wd;
  const rangesFor=w=>{const h=p.h;if(h.closed&&h.closed.includes(w))return[];const r=(h.d[w]!==undefined)?h.d[w]:h.d[D];return r===null||r===undefined?null:r;};
  const today=rangesFor(wd);if(today===null)return{s:2};
  for(const[a,b]of today){const A=tm(a),B=tm(b);if(B>A){if(mins>=A&&mins<B)return{s:B-mins<=60?3:0,until:b};}else{if(mins>=A)return{s:0,until:b};}}
  const y=rangesFor((wd+6)%7);if(y){for(const[a,b]of y){const A=tm(a),B=tm(b);if(B<=A&&mins<B)return{s:B-mins<=60?3:0,until:b};}}
  // next open today
  for(const[a]of today){if(tm(a)>mins)return{s:1,next:a};}
  return{s:1};
}

    ${dstr?`<dt>거리</dt><dd class="num">${dstr}</dd>`:""}
   </dl>
   <div class="acts">
    <a class="pri" href="${gmapsDir(p,"transit")}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8z"/></svg>구글맵으로 길찾기</a>
    <a href="${gmapsDir(p,"walking")}" target="_blank" rel="noopener">걸어서</a>
    <a href="${gmapsSearch(p)}" target="_blank" rel="noopener">지도에서 보기</a>
    <button id="bjBtn">일본어 크게 보기</button>
    <button id="doneBtn" class="${done.has(p.id)?"done":""}">${done.has(p.id)?"다녀옴 ✓":"다녀옴 표시"}</button>
   </div></div>`;
  $("#bjBtn").onclick=()=>{$("#bjJ").textContent=p.ja;$("#bjK").textContent=p.ko;$("#bjA").textContent=p.addr?p.addr:(p.how||"");$("#bigja").classList.add("on");};
  $("#doneBtn").onclick=()=>{if(done.has(p.id))done.delete(p.id);else done.add(p.id);store.set("done",[...done]);openSheet(p.id);placeMarkers();renderList();renderNear();};
  $("#sheet").classList.add("on");
  document.querySelectorAll(".mk").forEach(m=>m.classList.toggle("sel",m.dataset.id===id));}
function closeSheet(){$("#sheet").classList.remove("on");curId=null;document.querySelectorAll(".mk.sel").forEach(m=>m.classList.remove("sel"));}
$("#shX").onclick=closeSheet;$("#bjX").onclick=()=>$("#bigja").classList.remove("on");
(function(){const s=$("#sheet");let y0=null;s.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;},{passive:true});s.addEventListener("touchend",e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>70&&$("#shBody").scrollTop<=0)closeSheet();y0=null;});})();

/* ---------- 목록 ---------- */
function rowHtml(p,extra){const now=tokyoNow();const st=openState(p,now);return`<button class="row ${done.has(p.id)?"done":""}" data-id="${p.id}" style="--c:${CATS[p.cat].c}"><span class="bar"></span><span class="nm">${esc(p.ko)}<span class="st">${esc(p.st)}</span><span class="ja">${esc(p.ja)}</span><span class="why">${esc(p.why)}</span></span><span class="rt">${extra||""}${p.h?stateLabel(st):""}</span></button>`;}
function bindRows(el){el.querySelectorAll(".row").forEach(b=>b.onclick=()=>{openSheet(b.dataset.id);});}
function renderList(){const ds=$("#dayStrip");ds.innerHTML=`<button class="${dayFilter==="all"?"on":""}" data-d="all"><small>전체</small><b>All</b></button>`+DAYS.map(x=>`<button class="${dayFilter==x.d?"on":""}" data-d="${x.d}"><small>${x.w}</small><b class="num">${x.d}</b></button>`).join("");
  ds.querySelectorAll("button").forEach(b=>b.onclick=()=>{dayFilter=b.dataset.d==="all"?"all":+b.dataset.d;store.set("day",dayFilter);renderList();mapChips();drawRoute();placeMarkers();});
  const lc=$("#listChips");lc.innerHTML=`<button class="chip ${catFilter==="all"?"on":""}" data-c="all">전체</button>`+Object.entries(CATS).map(([k,v])=>`<button class="chip ${catFilter===k?"on":""}" data-c="${k}"><span class="dot" style="background:${v.c}"></span>${v.n}</button>`).join("");
  lc.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{catFilter=b.dataset.c;store.set("cat",catFilter);mapChips();placeMarkers();renderList();});
  let items=PLACES.filter(p=>catFilter==="all"||p.cat===catFilter);const body=$("#listBody");let html="";
  if(dayFilter==="all"){const groups=[["확정 · 계획","확정"],["추천","추천"],["대안·옵션","대안·옵션"],["참고","참고"]];for(const[t,s]of groups){const g=items.filter(p=>p.st===s);if(!g.length)continue;html+=`<div class="sec">${t} · ${g.length}</div><div class="list">${g.map(p=>rowHtml(p)).join("")}</div>`;}}
  else{const dd=DAYS.find(x=>x.d===dayFilter);const g=items.filter(p=>p.days.includes(dayFilter));const flex=items.filter(p=>!p.days.length&&(p.cat==="eat"||p.cat==="cafe"));
    html+=`<div class="sec">10/${dd.d} (${dd.w}) · ${dd.t}</div>`;html+=g.length?`<div class="list">${g.map(p=>rowHtml(p)).join("")}</div>`:`<div class="empty">이 날의 계획 장소가 없습니다.</div>`;
    if(flex.length&&(catFilter==="all"||catFilter==="eat"||catFilter==="cafe"))html+=`<div class="sec">언제든 · 숙소 근처 먹거리</div><div class="list">${flex.map(p=>rowHtml(p)).join("")}</div>`;}
  body.innerHTML=html||`<div class="empty">표시할 장소가 없습니다.</div>`;bindRows(body);}

/* ---------- 지금 근처 ---------- */
let nearMode=store.get("nearMode","eat");
function renderNear(){const sel=$("#refSel");if(!sel.options.length){sel.innerHTML=`<option value="__me">내 위치 (GPS)</option>`+AREAS.map(([n,id])=>`<option value="${id}">${n}</option>`).join("");sel.onchange=()=>{if(sel.value==="__me"){locate(true);}else{me=null;refId=sel.value;store.set("ref",refId);placeMarkers();}renderNear();};sel.value=me?"__me":refId;}
  $("#nbEat").classList.toggle("on",nearMode==="eat");$("#nbSee").classList.toggle("on",nearMode==="see");
  const ref=refPoint();$("#nbHome").href=gmapsDir(byId("dormy"),"transit");
  const now=tokyoNow();const cats=nearMode==="eat"?["eat","cafe"]:["see","shop","run"];
  let items=PLACES.filter(p=>cats.includes(p.cat)&&!p.offmap).map(p=>({p,d:km(ref,p),st:openState(p,now)}));
  const rank=s=>s.s===0?0:s.s===3?1:s.s===2?2:3;
  items.sort((a,b)=>rank(a.st)-rank(b.st)||a.d-b.d);
  const near=items.filter(x=>x.d<=4),far=items.filter(x=>x.d>4);
  const row=x=>rowHtml(x.p,`<b class="num">${fmtKm(x.d)} · 도보 ${walkMin(x.d)}분</b>`);
  let html="";
  html+=near.length?`<div class="sec">4km 안 · ${near.length}곳</div><div class="list">${near.map(row).join("")}</div>`:`<div class="empty">4km 안에는 없습니다. 아래에서 고르거나 기준 위치를 바꿔 보세요.</div>`;
  if(far.length)html+=`<div class="sec">더 멀리</div><div class="list">${far.map(row).join("")}</div>`;
  $("#nearBody").innerHTML=html;bindRows($("#nearBody"));
  $("#nearHint").textContent=(me?"내 위치":(byId(refId).ko.replace(/\s*\(.*\)$/,"")))+" 기준, 가까운 순. 영업 중인 곳이 먼저 나오고, 휴무·마감은 아래로 내려갑니다.";}
$("#nbEat").onclick=()=>{nearMode="eat";store.set("nearMode",nearMode);renderNear();};
$("#nbSee").onclick=()=>{nearMode="see";store.set("nearMode",nearMode);renderNear();};
$("#gpsBtn").onclick=()=>locate(true);

/* ---------- 여행 정보 ---------- */
const CHECK=["여권 · Visit Japan Web 동반가족 등록 후 QR 캡처","스카이라이너 왕복권 QR(이메일) 저장","보조배터리는 기내 가방에 (1인 2개, 위탁 불가, 선반 보관 금지)","액체류 100ml 이하, 지퍼백","실물 유심 · 핀 · 공유기 설정 확인","토스 체크카드(외화통장 연결) · 세븐뱅크 ATM에서 엔화 인출","러닝화 · 러닝 복장 2세트","온천용 작은 파우치(헤어밴드, 스킨케어)","예약 확인: 큐베이(10/23 점심), 야마하루(10/24 아침), 타츠야(10/22 저녁)"];
function renderInfo(){const ck=new Set(store.get("chk",[]));
  $("#infoBody").innerHTML=`
  <div class="card"><h3>항공 · 제주항공</h3>
   <div class="flight"><div class="ap">ICN<small>인천</small></div><div class="mid"><b>7C1175</b>10/20 (화)</div><div class="ap r">NRT<small>나리타 T3 · 12:15 도착</small></div></div>
   <div class="flight"><div class="ap">NRT<small>나리타 T3 · 16:50 출발</small></div><div class="mid"><b>7C1106</b>10/24 (토)</div><div class="ap r">ICN<small>인천</small></div></div>
   <dl class="kv"><dt>예약번호</dt><dd>별도 보관 (항공사 앱·이메일)</dd><dt>좌석</dt><dd>8E · 8F</dd><dt>귀국일</dt><dd>T3 14:20 도착 목표. 게이세이우에노 13:20경 스카이라이너.</dd></dl></div>
  <div class="card"><h3>숙소 · 도미인 우에노 오카치마치</h3>
   <dl class="kv"><dt>아고다</dt><dd>예약번호 별도 보관 · 더블룸 · 4박 (10/20~24)</dd><dt>결제</dt><dd>선결제 완료 · 숙박세 약 1,600엔 현장 납부</dd><dt>체크인</dt><dd>15:00 / 체크아웃 11:00</dd><dt>온천</dt><dd>12층 대욕장 15:00~익일 10:00 (사우나 01~05시 중단)</dd><dt>야식</dt><dd>무료 라멘 21:30~23:00</dd><dt>주소</dt><dd><span class="ja">東京都台東区上野6-7-22</span></dd></dl>
   <div class="acts" style="margin-top:10px"><a class="pri" href="${gmapsDir(byId("dormy"),"transit")}" target="_blank" rel="noopener">숙소로 길찾기</a></div></div>
  <div class="card"><h3>스카이라이너 · 공항 이동</h3>
   <dl class="kv"><dt>가는 날</dt><dd>T3 도착 → T2까지 도보 약 15분 또는 무료 셔틀 약 5분 → 공항제2빌딩역 창구에서 QR+여권으로 왕복권 교환, 귀국용 종이 교환권도 함께 수령. 게이세이우에노까지 약 41분.</dd><dt>오는 날</dt><dd>게이세이우에노역 창구에 종이 교환권 제시 → 좌석 지정. 15~20분 일찍 도착.</dd><dt>요금</dt><dd>온라인 왕복 4,500엔/인</dd></dl></div>
  <div class="card"><h3>하루 리듬</h3>
   <dl class="kv"><dt>아침</dt><dd>06시대 러닝(시노바즈 연못 또는 황거) → 숙소 온천 → 근처 아침</dd><dt>낮</dt><dd>하루 한 동네만. 걷다가 쉬고, 쉬다가 걷기</dd><dt>저녁</dt><dd>추천 식당 중 그날 기분으로. 21:30 이후 숙소 라멘, 온천</dd><dt>일몰</dt><dd>약 16:55 (10월 하순)</dd></dl></div>
  <div class="card"><h3>출발 전 체크</h3><ul class="chk">${CHECK.map((t,i)=>`<li class="${ck.has(i)?"ck":""}"><input type="checkbox" id="ck${i}" ${ck.has(i)?"checked":""}><label for="ck${i}">${esc(t)}</label></li>`).join("")}</ul></div>
  <div class="card"><h3>긴급</h3><dl class="kv"><dt>일본</dt><dd>경찰 110 · 구급 119</dd><dt>영사콜센터</dt><dd>+82-2-3210-0404 (24시간)</dd></dl></div>
  <div class="foot">Grace와 도쿄, 가을 · 2026</div>`;
  $("#infoBody").querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const t=b.dataset.copy;const fb=()=>{const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("길게 눌러 복사하세요");};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast("복사했습니다")).catch(fb);}else fb();});
  $("#infoBody").querySelectorAll("input[type=checkbox]").forEach(c=>c.onchange=()=>{const i=+c.id.slice(2);if(c.checked)ck.add(i);else ck.delete(i);store.set("chk",[...ck]);c.closest("li").classList.toggle("ck",c.checked);});}

/* ---------- 탭·커버 ---------- */
function showView(v){document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));closeSheet();if(v==="map"){if(USE_G){setTimeout(()=>{google.maps.event.trigger(gmap,"resize");placeMarkers();},50);}else if(USE_L){setTimeout(()=>lmap.invalidateSize(),50);}else{fitAspect();applyView();}}if(v==="near")renderNear();if(v==="list")renderList();}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showView(b.dataset.v));
$("#goBtn").onclick=()=>{$("#cover").classList.add("off");store.set("seen",true);if(USE_G){setTimeout(()=>{google.maps.event.trigger(gmap,"resize");placeMarkers();},50);}else if(USE_L){setTimeout(()=>lmap.invalidateSize(),50);}else{fitAspect();applyView();}};
$("#homeBtn").onclick=()=>{$("#cover").classList.remove("off");};

/* ---------- 시작 ---------- */
drawBase();buildMarkers();mapChips();renderList();renderNear();renderInfo();
if(store.get("seen",false))$("#cover").classList.add("off");
requestAnimationFrame(()=>{centerOn(35.700,139.772,30);drawRoute();setMode(mode);});
setTimeout(()=>locate(false),1200);
setInterval(()=>{if($("#v-near").classList.contains("on"))renderNear();},60000);
</script>
