<body>
<title>Grace와 도쿄, 가을</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/* Layout: one-screen app. Map/list/near/info views swap under a sticky header; bottom tab bar fixed. Place detail opens as a bottom sheet. */
:root{
  --bg:#f4efe8; --bg2:#ebe4da; --card:#fbf8f3; --fg:#2a2420; --mute:#7a6f66; --line:#dcd2c6;
  --accent:#c4643a; --accent-fg:#ffffff; --green:#52704c; --water:#c7d6de; --rail:#b9ada0; --park:#d6dec8; --shadow:0 10px 30px rgba(60,40,20,.14);
  --disp:"Gowun Batang","Shippori Mincho","Noto Serif KR",serif; --body:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif; --ja:"Shippori Mincho","Noto Sans JP",serif;
  --c-stay:#e11d48; --c-see:#0284c7; --c-eat:#ea580c; --c-cafe:#b45309; --c-shop:#7c3aed; --c-run:#15803d; --c-tr:#475569; --c-univ:#4338ca; --route:#1f2937;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e1a17; --bg2:#272220; --card:#2b2623; --fg:#ece4da; --mute:#a69a8e; --line:#3d3631;
  --accent:#d9825a; --accent-fg:#1e1a17; --green:#8fae86; --water:#2f3d46; --rail:#5a524b; --park:#2f3a2c; --shadow:0 10px 30px rgba(0,0,0,.45);
  --c-stay:#fb7185; --c-see:#38bdf8; --c-eat:#fb923c; --c-cafe:#fbbf24; --c-shop:#a78bfa; --c-run:#4ade80; --c-tr:#94a3b8; --c-univ:#a5b4fc; --route:#e5e7eb; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1e1a17; --bg2:#272220; --card:#2b2623; --fg:#ece4da; --mute:#a69a8e; --line:#3d3631;
  --accent:#d9825a; --accent-fg:#1e1a17; --green:#8fae86; --water:#2f3d46; --rail:#5a524b; --park:#2f3a2c; --shadow:0 10px 30px rgba(0,0,0,.45);
  --c-stay:#fb7185; --c-see:#38bdf8; --c-eat:#fb923c; --c-cafe:#fbbf24; --c-shop:#a78bfa; --c-run:#4ade80; --c-tr:#94a3b8; --c-univ:#a5b4fc; --route:#e5e7eb; color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;margin:0}
.ja{font-family:var(--ja);font-weight:500}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column}
header.top{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
header.top .t{font-family:var(--disp);font-size:18px;font-weight:700;letter-spacing:.01em}
header.top .t small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
header.top .clock{font-size:12px;color:var(--mute);text-align:right;line-height:1.3}
header.top .clock b{display:block;font-size:15px;color:var(--fg);font-weight:500}

main{flex:1;min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.scroll{height:100%;overflow-y:auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}

nav.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:var(--bg);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;color:var(--mute);border-radius:10px;white-space:nowrap}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--fg);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* map */
#mapwrap{position:absolute;inset:0;overflow:hidden;background:var(--bg2);touch-action:none;user-select:none}
#mapsvg{position:absolute;left:0;top:0;width:100%;height:100%}
#markers{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:1px}
.mk .pin{width:17px;height:17px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);background:var(--c)}
.mk.dim{opacity:.3}
.mk.me.dim{opacity:1}
.mk.stay .pin{width:24px;height:24px;border-width:3px}
.mk .lb{font-size:11px;font-weight:500;line-height:1.15;background:var(--card);color:var(--fg);padding:2px 6px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;display:none}
.mk.lbl .lb{display:block}
.mk.done .pin{opacity:.45}
.mk.must .pin{box-shadow:0 0 0 3px #f5b400,0 2px 6px rgba(0,0,0,.45);width:20px;height:20px}
.mk.must .lb{font-weight:700;border:1.5px solid #f5b400}
.chip.must.on{background:#f5b400;color:#1f1a14;border-color:#f5b400}
.acts button.must{background:#f5b400;color:#1f1a14}
.mk.sel .pin{transform:rotate(-45deg) scale(1.35)}
.mk.me{transform:translate(-50%,-50%)}
.mk.me .pin{width:16px;height:16px;border-radius:50%;transform:none;background:#2f7cf6;box-shadow:0 0 0 6px rgba(47,124,246,.25)}
.mapui{position:absolute;left:12px;right:12px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:800}
.mapui>*{pointer-events:auto}
.mapbtns{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:800}
.rbtn{width:42px;height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--fg)}
.rbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.legend{position:absolute;left:12px;bottom:14px;z-index:800;max-width:70%;background:var(--card);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--mute);box-shadow:var(--shadow);display:flex;gap:8px;flex-wrap:wrap;max-width:62%}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.svgtxt{font-family:var(--body);font-weight:500;fill:var(--fg);font-size:var(--fs,1px);paint-order:stroke;stroke:var(--bg2);stroke-width:calc(var(--fs,1px)*.35);stroke-linejoin:round;pointer-events:none}
.svgtxt.area{font-family:var(--disp);font-weight:700;fill:var(--mute);stroke:none;letter-spacing:.1em;font-size:calc(var(--fs,1px)*1.05);opacity:.6}
#mapsvg.far .svgtxt.area{display:none}
.svgtxt.minor{display:none}
#mapsvg.near .svgtxt.minor{display:block}
#mapsvg.near .svgtxt.area{opacity:.4}
#mapsvg.close .svgtxt.area{display:none}
.svgtxt.lmt{font-size:calc(var(--fs,1px)*.9);fill:var(--mute)}
.svgtxt.st{font-size:calc(var(--fs,1px)*.95)}
header.top .t{text-align:left}
header.top .jv{font-size:11px;letter-spacing:.06em;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:4px 10px;text-decoration:none}
#lmap{position:absolute;inset:0}
#gmap{position:absolute;inset:0}
#gmap .mk{z-index:1}
#gmap .mk.stay{z-index:2}
#gmap .mk.sel{z-index:3}
.leaflet-container{background:var(--bg2);font-family:var(--body)}
.leaflet-div-icon{background:none;border:0}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.6)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile{filter:brightness(.8) contrast(1.05) saturate(.85)} }
:root[data-theme="dark"] .leaflet-tile{filter:brightness(.8) contrast(1.05) saturate(.85)}

/* list */
.day-strip{display:flex;gap:6px;margin-bottom:10px}
.day-strip button{flex:1;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:var(--card);text-align:center;line-height:1.2}
.day-strip button small{display:block;font-size:10px;color:var(--mute)}
.day-strip button b{font-size:14px;font-weight:500}
.day-strip button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day-strip button.on small{color:var(--bg);opacity:.75}
.tl{display:flex;flex-direction:column;background:var(--card);border-radius:16px;padding:8px 14px 8px 10px}
.tls{display:grid;grid-template-columns:44px 14px 1fr;gap:0 8px;align-items:start;text-align:left;padding:8px 0;width:100%}
.tls .tt{font-size:12px;color:var(--mute);padding-top:2px}
.tls .tdot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--card);box-shadow:0 0 0 2px var(--c);margin-top:4px}
.tls .tb b{font-weight:500;font-size:14px}
.tls .tb small{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.tls.opt .tb b{color:var(--mute)}
.tleg{margin-left:66px;padding:2px 0 2px 10px;border-left:2px dashed var(--line);font-size:11.5px;color:var(--mute);min-height:14px}
.tleg.walk{border-left:3px solid var(--accent)}
.sec{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border-radius:14px;text-align:left;width:100%;min-width:0}
.row .bar{width:4px;height:100%;min-height:36px;border-radius:4px;background:var(--c)}
.row .nm{font-weight:500;min-width:0}
.row .nm .ja{display:block;font-size:12px;color:var(--mute);font-weight:400}
.row .nm .why{display:block;font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;font-size:11px;color:var(--mute);white-space:nowrap}
.row .rt b{display:block;font-weight:500;font-size:12px}
.row.done{opacity:.55}
.row .st{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);margin-left:6px;vertical-align:1px;color:var(--mute)}
.open{color:var(--green)} .closed{color:var(--mute)} .warn{color:var(--accent)}
.empty{padding:28px 10px;text-align:center;color:var(--mute);font-size:14px}

/* near */
.near-ref{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.near-ref .lbl{font-size:11px;color:var(--mute);letter-spacing:.06em}
.near-ref select{font:inherit;font-size:14px;background:transparent;color:var(--fg);border:0;border-bottom:1px solid var(--line);padding:2px 0;max-width:100%}
.near-ref .gps{margin-left:auto;font-size:12px;color:var(--accent);white-space:nowrap}
.bigbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.bigbtns button{background:var(--card);border-radius:14px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;border:1px solid transparent}
.bigbtns button.on{border-color:var(--accent);color:var(--accent)}
.bigbtns svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;color:var(--mute);margin:0 2px 10px}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);transform:translateY(110%);transition:transform .28s ease;max-height:78%;display:flex;flex-direction:column;z-index:1000}
#sheet:not(.on){visibility:hidden;pointer-events:none;transition:transform .28s ease,visibility 0s linear .28s}
#sheet.on{transform:translateY(0)}
#sheet .grab{flex:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px}

.sh-ja{font-size:16px;color:var(--mute);margin-top:2px}

.kv dt{color:var(--mute)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.acts a,.acts button{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:12px;font-size:14px;font-weight:500;text-decoration:none;background:var(--bg2);color:var(--fg)}

.acts button.done{background:var(--green);color:#fff}
.sh-x{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--mute)}
#bigja{position:absolute;inset:0;background:var(--card);z-index:1100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

ul.chk{list-style:none;margin:0;padding:0}

.foot{text-align:center;color:var(--mute);font-size:12px;margin:20px 0 6px;font-family:var(--disp)}

/* cover */
#cover{position:absolute;inset:0;z-index:2000;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 24px;overflow:hidden}

/* ---------- 탭·커버 ---------- */
function showView(v){document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));closeSheet();if(v==="map"){if(USE_G){setTimeout(()=>{google.maps.event.trigger(gmap,"resize");placeMarkers();},50);}else if(USE_L){setTimeout(()=>lmap.invalidateSize(),50);}else{fitAspect();applyView();}}if(v==="near")renderNear();if(v==="list")renderList();if(v==="rec")renderRec();}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>showView(b.dataset.v));
$("#goBtn").onclick=()=>{$("#cover").classList.add("off");store.set("seen",true);if(USE_G){setTimeout(()=>{google.maps.event.trigger(gmap,"resize");placeMarkers();},50);}else if(USE_L){setTimeout(()=>lmap.invalidateSize(),50);}else{fitAspect();applyView();}};
$("#homeBtn").onclick=()=>{$("#cover").classList.remove("off");};

if(store.get("seen",false))$("#cover").classList.add("off");

setInterval(()=>{if($("#v-near").classList.contains("on"))renderNear();},60000);
